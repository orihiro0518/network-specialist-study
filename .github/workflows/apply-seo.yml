name: Apply SEO

on:
  push:
    paths:
      - '.github/workflows/apply-seo.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply SEO changes
        run: python tools/apply_seo.py
      - name: Commit changes
        run: |
          git config user.name "orihiro0518"
          git config user.email "actions@users.noreply.github.com"
          git add index.html robots.txt sitemap.xml
          git rm .github/workflows/apply-seo.yml tools/apply_seo.py
          git commit -m "Improve Network Specialist SEO"
          git push
