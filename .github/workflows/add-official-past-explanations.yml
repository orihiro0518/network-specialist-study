name: Add Official Past Explanations
on:
  push:
    paths:
      - 'tools/add_official_explanations.py'
      - '.github/workflows/add-official-past-explanations.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site
        run: python3 tools/add_official_explanations.py
      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html past-explanations sitemap.xml
          git diff --cached --quiet || git commit -m 'Add R7 official past question explanations'
          git push
