name: Generate SEO Articles
on:
  push:
    paths:
      - '.github/workflows/generate-seo-articles.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate static SEO articles
        shell: python
        run: |
          from pathlib import Path
          import json, html

          base='https://orivector.jp/network-specialist-study'
          topics={
            'tcp-ip':('TCP/IPとは？4階層モデルと通信の流れ','TCP/IPの4階層、カプセル化、IPアドレス、ポート番号の関係をネスペ向けに整理。','TCP/IPは、ネットワーク通信を「アプリケーション・トランスポート・インターネット・ネットワークインターフェース」の層に分けて考える基本モデルです。','ネスペでは、障害がどの層で起きているかを切り分ける視点が重要です。HTTPやDNSはアプリケーション層、TCP/UDPはトランスポート層、IPはインターネット層として整理します。'),
            'subnetting':('サブネットマスクとCIDRの計算方法','CIDR、サブネットマスク、ネットワークアドレス、ブロードキャストアドレスをネスペ向けに解説。','CIDRはIPアドレスのネットワーク部の長さを /24 のように表す方法です。','午後問題では、利用可能ホスト数だけでなく、経路集約やアドレス設計とセットで問われます。/24ならホスト部は8bit、通常のIPv4サブネットでは利用可能ホスト数は2^8-2です。'),
            'vlan':('VLANとは？タグVLAN・アクセスポート・トランクを図解','VLAN、IEEE 802.1Q、アクセスポート、トランクポート、ネイティブVLANをネスペ向けに解説。','VLANは1台のL2スイッチを論理的に複数のLANへ分割する仕組みです。','スイッチ間で複数VLANを運ぶときは802.1Qタグを使うトランクが基本です。端末接続ポートは通常アクセスポートです。午後ではVLAN IDの不一致やタグ設定漏れが障害原因としてよく使われます。'),
            'stp':('STPとは？ループ防止とRSTPの仕組み','STP、RSTP、ルートブリッジ、BPDU、ポート役割をネスペ向けに整理。','STPはL2ネットワークのループを防止するため、冗長リンクの一部を論理的に止める仕組みです。','ルートブリッジはブリッジIDで選出され、各スイッチは最小コストの経路を選びます。RSTPはSTPより高速に収束します。障害切替時のポート状態変化を追えるようにしておくと午後問題に強くなります。'),
            'routing':('ルーティングとは？経路表・デフォルトルートを理解','ルーティングテーブル、ロンゲストマッチ、デフォルトルート、スタティックルートを解説。','ルータは宛先IPアドレスと経路表を照合し、次に転送する相手を決定します。','複数の経路が一致すると、一般に最もプレフィックス長が長い経路が優先されます。これがロンゲストプレフィックスマッチです。0.0.0.0/0 はどの具体的な経路にも一致しない場合のデフォルトルートとして使われます。'),
            'ospf':('OSPFとは？エリア・コスト・DR/BDRを図解','OSPF、リンクステート、エリア0、コスト、DR/BDR、LSAをネスペ向けに解説。','OSPFはリンクステート型のIGPで、ネットワーク状態を共有して最短経路を計算します。','大規模ネットワークではエリアに分割し、バックボーンエリア0を中心に設計します。コストは経路選択の尺度です。ブロードキャストネットワークではDR/BDRが選出され、隣接関係の数を抑えます。'),
            'bgp':('BGPとは？AS・経路選択・eBGP/iBGPを理解','BGP、AS番号、eBGP、iBGP、AS_PATH、LOCAL_PREFをネスペ向けに整理。','BGPはAS間で経路情報を交換するためのパスベクタ型ルーティングプロトコルです。','インターネットのような大規模ネットワークで利用されます。AS_PATHは通過ASの列を持ち、ループ防止や経路選択に使われます。企業ネットワークの冗長インターネット接続では、どちらの回線を優先するかという設計問題で登場します。'),
            'dns':('DNSとは？名前解決・権威DNS・キャッシュDNSを図解','DNS、再帰問い合わせ、反復問い合わせ、A/AAAA/CNAME/MX/PTRレコードを解説。','DNSはドメイン名とIPアドレスなどの情報を対応付ける分散型データベースです。','端末は通常キャッシュDNSへ問い合わせ、キャッシュDNSが必要に応じてルート、TLD、権威DNSへ問い合わせます。ネスペではTTL、キャッシュ、正引き・逆引き、冗長化や障害時の挙動が重要です。'),
            'dhcp':('DHCPとは？DORAとDHCPリレーを図解','DHCP Discover/Offer/Request/Ack、リース、DHCPリレーをネスペ向けに解説。','DHCPは端末へIPアドレス、サブネットマスク、デフォルトゲートウェイ、DNSなどを自動配布する仕組みです。','基本シーケンスはDiscover→Offer→Request→Ackです。ブロードキャストがルータを越えないため、別セグメントのDHCPサーバを利用するときはDHCPリレーを使います。'),
            'nat':('NAT・NAPTとは？アドレス変換の仕組み','NAT、NAPT、静的NAT、動的NAT、ポート変換をネスペ向けに整理。','NATはIPアドレスを書き換えて異なるアドレス空間を接続する技術です。','家庭や企業のインターネット接続では、複数のプライベートIPを1つまたは少数のグローバルIPへ多重化するNAPTが一般的です。午後では変換テーブル、戻り通信、サーバ公開時の静的変換を追う問題が出やすいです。'),
            'vpn':('VPNとは？IPsec・SSL-VPN・トンネルを比較','IPsec VPN、SSL-VPN、トンネルモード、ESP、IKEをネスペ向けに解説。','VPNは公衆ネットワーク上に暗号化された論理的な専用経路を構築する技術です。','拠点間接続ではIPsec VPNがよく使われます。IPsecではIKEで鍵やSecurity Associationを確立し、ESPで暗号化・認証を行う構成が代表的です。リモートアクセスではTLSを利用するSSL-VPNも重要です。'),
            'firewall':('ファイアウォールとは？ステートフル検査とACLの違い','ファイアウォール、ACL、ステートフルインスペクション、DMZをネスペ向けに整理。','ファイアウォールは通信をルールに基づいて許可・拒否し、ネットワーク境界を保護します。','単純なACLは送信元・宛先・ポートなどで判定します。ステートフル型は通信状態も追跡するため、確立済みセッションの戻り通信を適切に扱えます。DMZ構成やルール順序は午後問題で頻出です。')
          }

          style='''body{margin:0;background:#08111f;color:#edf4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.8}main{max-width:860px;margin:auto;padding:24px 18px 64px}a{color:#61dafb}.crumb{font-size:13px;color:#9fb2cc;margin-bottom:26px}.hero{padding:18px 0 10px}.hero h1{font-size:clamp(30px,6vw,48px);line-height:1.25;margin:0 0 12px}.lead{color:#c8d5e5;font-size:18px}.card{background:#101b2c;border:1px solid #213651;border-radius:18px;padding:20px;margin-top:18px}.card h2{margin-top:0}.diagram{background:#07101c;border:1px solid #213651;border-radius:14px;padding:16px;white-space:pre-wrap;font-family:ui-monospace,monospace;color:#c7eaff}.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.links a{display:block;background:#13243a;border:1px solid #213651;border-radius:12px;padding:12px;text-decoration:none}.tip{border-left:4px solid #61dafb;padding:12px 16px;background:#0d1d30;border-radius:0 12px 12px 0}'''

          slugs=list(topics)
          for i,(slug,(title,desc,intro,detail)) in enumerate(topics.items()):
            url=f'{base}/{slug}/'
            prev=slugs[i-1] if i else slugs[-1]
            nxt=slugs[(i+1)%len(slugs)]
            schema={"@context":"https://schema.org","@graph":[{"@type":["Article","LearningResource"],"headline":title,"description":desc,"url":url,"inLanguage":"ja","isAccessibleForFree":True,"educationalUse":"ネットワークスペシャリスト試験対策","publisher":{"@type":"Organization","name":"ORIVECTOR","url":"https://orivector.jp/"}},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"ORIVECTOR","item":"https://orivector.jp/"},{"@type":"ListItem","position":2,"name":"ネットワークスペシャリスト","item":base+'/'},{"@type":"ListItem","position":3,"name":title,"item":url}]}]}
            body=f'''<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{html.escape(title)}｜ネスペ対策｜ORIVECTOR</title><meta name="description" content="{html.escape(desc,quote=True)}"><link rel="canonical" href="{url}"><meta name="robots" content="index,follow,max-image-preview:large"><meta property="og:type" content="article"><meta property="og:site_name" content="ORIVECTOR"><meta property="og:title" content="{html.escape(title,quote=True)}"><meta property="og:description" content="{html.escape(desc,quote=True)}"><meta property="og:url" content="{url}"><meta name="twitter:card" content="summary"><script type="application/ld+json">{json.dumps(schema,ensure_ascii=False,separators=(',',':'))}</script><style>{style}</style></head><body><main><div class="crumb"><a href="https://orivector.jp/">ORIVECTOR</a> › <a href="../">ネスペ対策</a> › {html.escape(title)}</div><section class="hero"><h1>{html.escape(title)}</h1><p class="lead">{html.escape(intro)}</p></section><section class="card"><h2>まずここを理解</h2><p>{html.escape(detail)}</p><div class="tip"><b>ネスペ対策ポイント：</b> 用語だけでなく、パケットやフレームがどこを通り、どの装置がどの情報を見て判断するかまで追えるようにすると午後問題で強くなります。</div></section><section class="card"><h2>通信の流れで覚える</h2><div class="diagram">端末 → L2スイッチ → ルータ／L3スイッチ → サーバ\n      ↓             ↓                 ↓\n MAC/VLAN       IP・経路選択      TCP/UDP・アプリ</div><p>問題文では「どの層の情報を使っているか」「どのテーブルを参照するか」「障害時にどこまで通信できるか」を意識して読みます。</p></section><section class="card"><h2>試験でのひっかけポイント</h2><ul><li>似た用語を役割だけで暗記して、通信の流れを追えていない</li><li>L2とL3、制御プレーンとデータプレーンを混同する</li><li>正常系だけ見て、冗長化時の切替や戻り通信を確認しない</li></ul></section><section class="card"><h2>関連テーマ</h2><div class="links"><a href="../{prev}/">← {html.escape(topics[prev][0])}</a><a href="../{nxt}/">{html.escape(topics[nxt][0])} →</a><a href="../">無料問題集500問で確認する →</a></div></section></main></body></html>'''
            d=Path(slug); d.mkdir(exist_ok=True); (d/'index.html').write_text(body,encoding='utf-8')

          cards=''.join(f'<a href="../{s}/"><strong>{html.escape(v[0])}</strong><span>{html.escape(v[1])}</span></a>' for s,v in topics.items())
          idx=f'''<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ネスペ基礎解説一覧｜ネットワークスペシャリスト対策｜ORIVECTOR</title><meta name="description" content="TCP/IP、VLAN、STP、OSPF、BGP、DNS、DHCP、NAT、VPNなどネットワークスペシャリスト頻出テーマを個別記事で無料解説。"><link rel="canonical" href="{base}/articles/"><style>{style}.list a{{display:block;background:#101b2c;border:1px solid #213651;border-radius:16px;padding:18px;margin:12px 0;text-decoration:none}}.list span{{display:block;color:#c8d5e5;margin-top:6px}}</style></head><body><main><div class="crumb"><a href="https://orivector.jp/">ORIVECTOR</a> › <a href="../">ネスペ対策</a> › 基礎解説一覧</div><section class="hero"><h1>ネットワークスペシャリスト 基礎解説</h1><p class="lead">頻出テーマを1記事ずつ、通信の流れと試験ポイントで理解する。</p></section><div class="list">{cards}</div></main></body></html>'''
          Path('articles').mkdir(exist_ok=True); Path('articles/index.html').write_text(idx,encoding='utf-8')

          urls=[base+'/',base+'/articles/']+[f'{base}/{s}/' for s in slugs]
          sm='<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'+''.join(f'<url><loc>{u}</loc></url>\n' for u in urls)+'</urlset>\n'
          Path('sitemap.xml').write_text(sm,encoding='utf-8')
          Path('robots.txt').write_text(f'User-agent: *\nAllow: /\n\nSitemap: https://orivector.jp/network-specialist-study/sitemap.xml\n',encoding='utf-8')
      - name: Commit generated articles
        run: |
          git config user.name "orihiro0518"
          git config user.email "actions@users.noreply.github.com"
          git add tcp-ip subnetting vlan stp routing ospf bgp dns dhcp nat vpn firewall articles sitemap.xml robots.txt
          git diff --cached --quiet && exit 0
          git commit -m "Add Network Specialist SEO articles"
          git push
