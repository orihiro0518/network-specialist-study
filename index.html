t:blank"></iframe></div></section></main><script>const home=document.getElementById('home'),practiceMenu=document.getElementById('practiceMenu'),guideMenu=document.getElementById('guideMenu'),legacyPanel=document.getElementById('legacyPanel'),frame=document.getElementById('legacyFrame');function hideAll(){[home,practiceMenu,guideMenu,legacyPanel].forEach(x=>x.classList.add('hidden'))}function showHome(){legacyPanel.classList.remove('fullscreen');frame.src='about:blank';hideAll();home.classList.remove('hidden');scrollTo(0,0)}function showPracticeMenu(){hideAll();practiceMenu.classList.remove('hidden');scrollTo(0,0)}function showGuideMenu(){hideAll();guideMenu.classList.remove('hidden');scrollTo(0,0)}function installLegacyUx(w){try{if(w.document.documentElement.dataset.orivectorQuizUx)return;w.document.documentElement.dataset.orivectorQuizUx='1';const style=w.document.createElement('style');style.id='orivectorQuizFocusStyle';style.textContent='body.orivector-quiz-focus .orivector-author,body.orivector-quiz-focus .orivector-comparison-cluster{display:none!important}body.orivector-quiz-focus #quiz .quizBox>.card{padding:18px!important;border-radius:20px!important;background:rgba(16,29,49,.96)!important;border:1px solid #29425f!important;box-shadow:0 16px 42px #0005!important}body.orivector-quiz-focus #quiz .qmeta{margin:0 0 14px!important;padding:10px 12px!important;background:#0a1728!important;border:1px solid #29425f!important;border-radius:13px!important;color:#aebed1!important;font-size:12px!important;font-weight:800!important}body.orivector-quiz-focus #quiz .quizProgressTrack{height:8px!important;background:#07111f!important;border:1px solid #213651!important;border-radius:999px!important;overflow:hidden!important;margin:0 2px 14px!important}body.orivector-quiz-focus #quiz .quizProgressBar{background:#61dafb!important;border-radius:999px!important}body.orivector-quiz-focus #quiz .qtext{font-size:clamp(20px,4.8vw,25px)!important;line-height:1.65!important;margin:18px 2px 20px!important}body.orivector-quiz-focus #quiz #choices{display:grid!important;gap:10px!important}body.orivector-quiz-focus #quiz .choice{min-height:56px!important;padding:15px 16px!important;margin:0!important;border-radius:14px!important;background:#0d1c30!important;border:1px solid #2b4563!important;font-size:15px!important;line-height:1.55!important;box-shadow:none!important}body.orivector-quiz-focus #quiz .choice.correct{border-color:#44d49b!important;background:#103524!important}body.orivector-quiz-focus #quiz .choice.wrong{border-color:#ff6b81!important;background:#3a1822!important}body.orivector-quiz-focus #quiz .explain{margin-top:16px!important;padding:17px!important;background:#0b1728!important;border:1px solid #29425f!important;border-left:4px solid #61dafb!important;border-radius:14px!important;line-height:1.8!important}body.orivector-quiz-focus #quiz #quizActions .btn.primary{min-height:52px!important;border-radius:14px!important;font-size:15px!important;font-weight:900!important;box-shadow:0 10px 26px #0007!important}body.orivector-quiz-focus #officialPast .card,body.orivector-quiz-focus #afternoon .card{border-radius:20px!important;border-color:#29425f!important}body.orivector-quiz-focus #officialPast .choice,body.orivector-quiz-focus #afternoon .choice{min-height:56px!important;padding:15px 16px!important;border-radius:14px!important}';w.document.head.appendChild(style);const comparison=[...w.document.querySelectorAll('section')].find(s=>s.querySelector('h2')?.textContent.includes('ネットワークの違いを比較で理解'));if(comparison)comparison.classList.add('orivector-comparison-cluster');const syncFocus=()=>{const ids=['quiz','officialPast','afternoon'];const active=ids.some(id=>{const el=w.document.getElementById(id);return el&&!el.classList.contains('hidden')});w.document.body.classList.toggle('orivector-quiz-focus',active)};new w.MutationObserver(syncFocus).observe(w.document.body,{subtree:true,attributes:true,attributeFilter:['class']});syncFocus();w.document.addEventListener('click',e=>{if(e.target.closest('#quizActions .btn.primary,#officialNextBtn,#afActions .btn.primary'))setTimeout(()=>w.scrollTo({top:0,behavior:'smooth'}),50)})}catch(e){console.error(e)}}function loadLegacy(after){hideAll();legacyPanel.classList.remove('hidden');legacyPanel.classList.add('fullscreen');frame.onload=()=>{try{const w=frame.contentWindow;installLegacyUx(w);after(w)}catch(e){console.error(e)}};frame.src='legacy.html?v=304&ts='+Date.now()}function openLegacy(view){loadLegacy(w=>{if(view==='practiceSetup'&&w.openPracticeSetup)w.openPracticeSetup();else if(w.showView)w.showView(view);requestAnimationFrame(()=>w.scrollTo({top:0,behavior:'smooth'}))})}function openPractice(count){loadLegacy(w=>{if(w.openPracticeSetup){w.openPracticeSetup(count);if(w.startPractice)w.startPractice();requestAnimationFrame(()=>w.scrollTo({top:0,behavior:'smooth'}))}})}function openLegacyAction(action){loadLegacy(w=>{if(action==='weak'&&w.startQuiz){w.startQuiz('weak');requestAnimationFrame(()=>w.scrollTo({top:0,behavior:'smooth'}))}})}</script></body></html>
