<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ネットワークスペシャリスト試験対策｜ORIVECTOR</title><style>:root{--bg:#08111f;--panel:#101b2c;--text:#edf4ff;--muted:#9fb2cc;--accent:#61dafb;--line:#213651}*{box-sizing:border-box}body{margin:0;background:#08111f;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.global{padding:8px 16px;border-bottom:1px solid #ffffff12}.global a{color:inherit;text-decoration:none;font-size:13px;font-weight:850}.topin,.wrap{max-width:1080px;margin:auto}.topin{padding:14px 16px;display:flex;justify-content:space-between}.brand{font-weight:950}.brand span{color:var(--accent)}.ver,.badge{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 9px}.wrap{padding:28px 16px 80px}.hero h1{font-size:clamp(30px,6vw,54px);line-height:1.08}.hero p,.card p{color:var(--muted);line-height:1.7}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.card,.btn{background:#101b2c;border:1px solid var(--line);border-radius:18px;padding:20px;color:inherit;text-decoration:none;cursor:pointer;font:inherit}.card{text-align:left}.icon{font-size:30px}.card h2{margin:9px 0}.hidden{display:none!important}.panel{margin-top:22px}.panelhead{display:flex;justify-content:space-between}.optiongrid,.guidegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.option{background:#0d1d31;border:1px solid var(--line);border-radius:16px;padding:16px}.btn{display:inline-block;padding:12px 14px;font-weight:800}.primary{background:#4b68e8}.framewrap{margin-top:18px;border:1px solid var(--line);border-radius:18px;overflow:hidden}.framebar{padding:10px}.framewrap iframe{width:100%;height:75vh;border:0;display:block}#legacyPanel.fullscreen{position:fixed;inset:0;z-index:1000;margin:0!important;background:#08111f}#legacyPanel.fullscreen .framewrap{margin:0;border:0;border-radius:0;width:100vw;height:100dvh}#legacyPanel.fullscreen .framebar{display:none}#legacyPanel.fullscreen iframe{width:100vw;height:100dvh;min-height:100vh;border:0;display:block;background:#08111f}@media(max-width:760px){.menu,.optiongrid,.guidegrid{grid-template-columns:1fr}}</style></head><body><div class="global"><a href="https://orivector.jp/">← ORIVECTORトップへ</a></div><header><div class="topin"><div class="brand" onclick="showHome()"><span>ORIVECTOR</span> / ネスペ</div><div class="ver">Ver 3.0.3</div></div></header><main class="wrap"><section id="home"><div class="hero"><span class="badge">ORIVECTOR LEARN</span><h1>ネットワークスペシャリストを、<br>迷わず進める。</h1><p>問題演習・基礎学習・学習ガイドの3つから選べます。</p></div><div class="menu"><button class="card" onclick="showPracticeMenu()"><div class="icon">✏️</div><h2>問題演習</h2><p>10問・20問、午後問題、IPA公式過去問、苦手復習。</p></button><button class="card" onclick="openLegacy('learn')"><div class="icon">📚</div><h2>基礎学習</h2><p>TCP/IP、VLAN、STP、OSPF、BGP、DNS、VPNなどを体系的に学習。</p></button><button class="card" onclick="showGuideMenu()"><div class="icon">📖</div><h2>学習ガイド</h2><p>比較・頻出論点・仕組みを深掘り。</p></button></div></section><section id="practiceMenu" class="panel hidden"><div class="panelhead"><h2>✏️ 問題演習</h2><button class="btn" onclick="showHome()">← 戻る</button></div><div class="optiongrid"><div class="option"><h3>10問演習</h3><button class="btn primary" onclick="openPractice(10)">10問で始める</button></div><div class="option"><h3>20問演習</h3><button class="btn primary" onclick="openPractice(20)">20問で始める</button></div><div class="option"><h3>全問題・条件指定</h3><button class="btn" onclick="openLegacy('practiceSetup')">条件を選ぶ</button></div><div class="option"><h3>午後問題対策</h3><button class="btn" onclick="openLegacy('afternoon')">午後問題へ</button></div><div class="option"><h3>IPA公式過去問</h3><button class="btn" onclick="openLegacy('officialPast')">公式過去問へ</button></div><div class="option"><h3>苦手だけ復習</h3><button class="btn" onclick="openLegacyAction('weak')">苦手復習へ</button></div><div class="option"><h3>問題一覧</h3><button class="btn" onclick="openLegacy('questionList')">問題一覧へ</button></div></div></section><section id="guideMenu" class="panel hidden"><div class="panelhead"><h2>📖 学習ガイド</h2><button class="btn" onclick="showHome()">← 戻る</button></div><div class="guidegrid"><a class="card" href="comparisons/"><h3>比較記事まとめ</h3></a><a class="card" href="tcp-vs-udp/"><h3>TCP と UDP</h3></a><a class="card" href="vlan-vs-subnet/"><h3>VLAN とサブネット</h3></a><a class="card" href="ospf-vs-bgp/"><h3>OSPF と BGP</h3></a></div></section><section id="legacyPanel" class="panel hidden"><div class="framewrap"><div class="framebar"><button class="btn" onclick="showHome()">← 共通トップへ</button></div><iframe id="legacyFrame" src="about:blank"></iframe></div></section></main><script>const home=document.getElementById('home'),practiceMenu=document.getElementById('practiceMenu'),guideMenu=document.getElementById('guideMenu'),legacyPanel=document.getElementById('legacyPanel'),frame=document.getElementById('legacyFrame');function hideAll(){[home,practiceMenu,guideMenu,legacyPanel].forEach(x=>x.classList.add('hidden'))}function showHome(){legacyPanel.classList.remove('fullscreen');frame.src='about:blank';hideAll();home.classList.remove('hidden');scrollTo(0,0)}function showPracticeMenu(){hideAll();practiceMenu.classList.remove('hidden');scrollTo(0,0)}function showGuideMenu(){hideAll();guideMenu.classList.remove('hidden');scrollTo(0,0)}function installLegacyUx(w){try{if(w.document.documentElement.dataset.orivectorQuizUx)return;w.document.documentElement.dataset.orivectorQuizUx='1';w.document.addEventListener('click',e=>{if(e.target.closest('#quizActions .btn.primary,#officialNextBtn,#afActions .btn.primary'))setTimeout(()=>w.scrollTo({top:0,behavior:'smooth'}),50)})}catch(e){console.error(e)}}function loadLegacy(after){hideAll();legacyPanel.classList.remove('hidden');legacyPanel.classList.add('fullscreen');frame.onload=()=>{try{const w=frame.contentWindow;installLegacyUx(w);after(w)}catch(e){console.error(e)}};frame.src='legacy.html?v=303&ts='+Date.now()}function openLegacy(view){loadLegacy(w=>{if(view==='practiceSetup'&&w.openPracticeSetup)w.openPracticeSetup();else if(w.showView)w.showView(view);requestAnimationFrame(()=>w.scrollTo({top:0,behavior:'smooth'}))})}function openPractice(count){loadLegacy(w=>{if(w.openPracticeSetup){w.openPracticeSetup(count);if(w.startPractice)w.startPractice();requestAnimationFrame(()=>w.scrollTo({top:0,behavior:'smooth'}))}})}function openLegacyAction(action){loadLegacy(w=>{if(action==='weak'&&w.startQuiz){w.startQuiz('weak');requestAnimationFrame(()=>w.scrollTo({top:0,behavior:'smooth'}))}})}</script></body></html>
